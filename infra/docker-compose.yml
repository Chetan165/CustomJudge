# Infra only. The compile/execute workers run host-native: isolate needs a
# delegated cgroup v2 subtree, and container CPU contention distorts the
# time measurements a judge depends on.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customjudge
      POSTGRES_USER: customjudge
      POSTGRES_PASSWORD: customjudge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customjudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../.env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      REDIS_HOST: redis
    ports:
      - "2358:2358"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Identical host and container paths so DB-stored paths resolve on both
      # sides without translation.
      - /var/lib/customjudge:/var/lib/customjudge

volumes:
  pgdata:
  redisdata:
